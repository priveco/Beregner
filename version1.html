<!DOCTYPE html>

<html lang="da">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amortiseringsberegner</title>

 

<style>

body {

font-family: Arial, sans-serif;

max-width: 1000px;

margin: auto;

padding: 20px;

}

 

h1 {

text-align: center;

}

 

input {

width: 100%;

padding: 8px;

margin-bottom: 12px;

box-sizing: border-box;

}

 

button {

background: #0078d4;

color: white;

border: none;

padding: 10px 20px;

cursor: pointer;

}

 

button:hover {

background: #005ea6;

}

 

.result {

margin-top: 20px;

background: #f3f3f3;

padding: 15px;

}

 

table {

width: 100%;

border-collapse: collapse;

margin-top: 20px;

}

 

th, td {

border: 1px solid #ccc;

padding: 8px;

text-align: right;

}

 

th {

background: #efefef;

}

</style>

</head>

<body>

 

<h1>Amortiseringsberegner</h1>

 

<label>Lånebeløb (kr.)</label>

<input id="loan" type="number" value="2000000">

 

<label>Rente (%)</label>

<input id="rate" type="number" step="0.01" value="4">

 

<label>Løbetid (år)</label>

<input id="years" type="number" value="30">

 

<label>Ekstraordinært afdrag (kr.)</label>

<input id="extra" type="number" value="0">

 

<button onclick="calculate()">Beregn</button>

 

<div id="result" class="result"></div>

 

<div id="schedule"></div>

 

<script>

 

function formatDKK(value) {

return value.toLocaleString('da-DK', {

minimumFractionDigits: 0,

maximumFractionDigits: 0

});

}

 

function calculate() {

 

let loan = parseFloat(document.getElementById("loan").value);

let annualRate = parseFloat(document.getElementById("rate").value) / 100;

let years = parseInt(document.getElementById("years").value);

let extra = parseFloat(document.getElementById("extra").value);

 

let adjustedLoan = loan - extra;

 

if (adjustedLoan <= 0) {

alert("Afdrag kan ikke overstige lånet.");

return;

}

 

let monthlyRate = annualRate / 12;

let months = years * 12;

 

let payment =

adjustedLoan *

monthlyRate /

(1 - Math.pow(1 + monthlyRate, -months));

 

let balance = adjustedLoan;

let totalInterest = 0;

 

let yearlyData = [];

 

for (let year = 1; year <= years; year++) {

 

let yearInterest = 0;

let yearPrincipal = 0;

 

for (let m = 0; m < 12; m++) {

 

let interest = balance * monthlyRate;

let principal = payment - interest;

 

balance -= principal;

 

yearInterest += interest;

yearPrincipal += principal;

totalInterest += interest;

 

if (balance <= 0) {

balance = 0;

break;

}

}

 

yearlyData.push({

year: year,

principal: yearPrincipal,

interest: yearInterest,

remain: balance

});

 

if (balance <= 0) {

break;

}

}

 

document.getElementById("result").innerHTML =

`

<h2>Resultat</h2>

 

<p><b>Månedlig ydelse:</b> ${formatDKK(payment)} kr.</p>

 

<p><b>Samlede renter:</b>

${formatDKK(totalInterest)} kr.</p>

 

<p><b>Ekstraordinært afdrag:</b>

${formatDKK(extra)} kr.</p>

`;

 

let html =

`

<table>

<tr>

<th>År</th>

<th>Afdrag</th>

<th>Renter</th>

<th>Restgæld</th>

</tr>

`;

 

yearlyData.forEach(r => {

 

html += `

<tr>

<td>${r.year}</td>

<td>${formatDKK(r.principal)}</td>

<td>${formatDKK(r.interest)}</td>

<td>${formatDKK(r.remain)}</td>

</tr>

`;

});

 

html += "</table>";

 

document.getElementById("schedule").innerHTML = html;

}

 

calculate();

 

</script>

 

</body>

</html>
